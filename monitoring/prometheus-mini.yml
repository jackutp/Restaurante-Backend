global:
  scrape_interval: 15s
rule_files:
  - /otel-lgtm/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093
scrape_configs:
  - job_name: 'eureka-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8762
  - job_name: 'gateway-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8091
  - job_name: 'cambios-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8109
  - job_name: 'solicitudes-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
  - job_name: 'usuarios-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8221
  - job_name: 'incidentes'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8004
