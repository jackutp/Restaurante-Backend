global:
  scrape_interval: 15s
rule_files:
  -alert-rules.yml
alerting:
  alertManagers:
    - static_configs:
        - targets:
            - localhost:9093
scrape_configs:
  - job_name: 'eureka'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761
  - job_name: 'eureka-gestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
      - host.docker.internal:8762
  - job_name: 'gateway'
    metrics_path: /actuator/prometheus
    static_configs:
