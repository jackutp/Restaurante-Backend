spring.application.name=microservicio-proveedor
server.port=8200
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.cloud.discovery.client.composite-indicator.enabled=true
#EUREKA
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:localhost}
eureka.instance.preferIpAddress=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Configuracion de pool de conexiones
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.profiles.default=local
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always